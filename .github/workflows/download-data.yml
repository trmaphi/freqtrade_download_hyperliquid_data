name: Download data

on:
  workflow_dispatch:
    inputs:
      squash_history:
        description: 'Squash git history after download'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 1 * * *'   # 1 AM UTC
    - cron: '0 3 * * *'   # 3 AM UTC
    - cron: '0 6 * * *'   # 6 AM UTC
    - cron: '0 9 * * *'   # 9 AM UTC
    - cron: '0 12 * * *'  # 12 PM UTC
    - cron: '0 15 * * *'  # 3 PM UTC
    - cron: '0 18 * * *'  # 6 PM UTC
    - cron: '0 21 * * *'  # 9 PM UTC

jobs:
  download_data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: |
          ls -ltran

      - name: Download_data-spot
        env:
          FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy: ${{ secrets.FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy }}
        run: |
          docker run --rm \
          -e FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy \
          --mount type=bind,source=$(pwd)/user_data,target=/freqtrade/user_data/ \
          freqtradeorg/freqtrade:stable \
          download-data \
          --exchange hyperliquid \
          --trading-mode spot \
          --pairs=".*" \
          --timeframes 1m 3m 5m 15m 30m 1h 2h 4h 8h 12h 1d 3d 1w 1M \
          --prepend \
          --new-pairs-days 18 \
          --config=/freqtrade/user_data/config.json 2>&1 | tee download_data_logs_spot.txt

      - name: Download_data-futures
        env:
          FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy: ${{ secrets.FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy }}
        run: |
          docker run --rm \
          -e FREQTRADE__EXCHANGE__CCXT_ASYNC_CONFIG__httpProxy \
          --mount type=bind,source=$(pwd)/user_data,target=/freqtrade/user_data/ \
          freqtradeorg/freqtrade:stable \
          download-data \
          --exchange hyperliquid \
          --trading-mode futures \
          --pairs=".*" \
          --timeframes 1m 3m 5m 15m 30m 1h 2h 4h 8h 12h 1d 3d 1w 1M \
          --new-pairs-days 18 \
          --config=/freqtrade/user_data/config.json 2>&1 | tee download_data_logs_futures.txt

      - name: Fix permissions before commit
        run: |
          sudo chown -R $(id -u):$(id -g) .

      - name: Report data content spot
        run: |
          docker run --rm \
            --mount type=bind,source=$(pwd)/user_data,target=/freqtrade/user_data/ \
            freqtradeorg/freqtrade:stable \
            list-data \
            --exchange hyperliquid \
            --trading-mode spot \
            --show-timerange | tee data_content_spot.txt

      - name: Report data content futures
        run: |
          docker run --rm \
            --mount type=bind,source=$(pwd)/user_data,target=/freqtrade/user_data/ \
            freqtradeorg/freqtrade:stable \
            list-data \
            --exchange hyperliquid \
            --trading-mode futures \
            --show-timerange | tee data_content_futures.txt

      - name: Commit and push
        run: |
          git config --global user.name 'trmaphi'
          git config --global user.email 'trmaphi@users.noreply.github.com'
          git add .
          git commit -m "updated data report"
          git push

      - name: Squash git history
        if: ${{ github.event.inputs.squash_history == 'true' }}
        run: |
          git checkout --orphan temp_branch
          git add -A
          git commit -m "Squashed: keep only the current state"
          git branch -M main
          git push --force
